<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>小样</title>
  <style>
    :root{
      --bg:#f5f2ec;
      --ink:#2b2620;
      --ink-2:#6b6259;
      --gold:#b8935a;
      --card:rgba(255,255,255,.72);
      --shadow:0 8px 32px rgba(43,38,32,.10);
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;
      font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
      color:var(--ink);background:var(--bg);}
    canvas{display:block}

    /* 左侧茶壶选择 */
    #modelUI{
      position:fixed;left:36px;top:50%;transform:translateY(-50%);
      display:flex;flex-direction:column;gap:14px;
      z-index:10;
    }
    .model-card{
      position:relative;
      display:flex;flex-direction:column;align-items:center;gap:8px;
      padding:12px 10px;
      border:0;border-radius:16px;cursor:pointer;
      background:var(--card);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      box-shadow:var(--shadow);
      transition:.3s cubic-bezier(.2,.8,.2,1);
      text-align:center;
      overflow:hidden;
      width:96px;
    }
    .model-card::before{
      content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
      background:var(--gold);transform:scaleY(0);transform-origin:center;
      transition:.3s;
    }
    .model-card:hover{transform:translateX(4px)}
    .model-card.active::before{transform:scaleY(1)}
    .model-card.active{
      background:rgba(255,255,255,.92);
      box-shadow:0 12px 40px rgba(43,38,32,.16);
    }
    .model-card img{
      width:56px;height:56px;border-radius:12px;
      object-fit:cover;background:#f0ece4;display:block;
      transition:.3s;
    }
    .model-card.active img{transform:scale(1.05)}
    .model-card .meta{display:flex;flex-direction:column;gap:4px;align-items:center}
    .model-card .name{
      font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.08em;
    }

    /* 底部材质选择 */
    #matUI{
      position:fixed;bottom:36px;left:50%;transform:translateX(-50%);
      display:flex;gap:12px;
      padding:10px;
      background:var(--card);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      border-radius:20px;
      box-shadow:var(--shadow);
      z-index:10;
    }
    .mat-card{
      position:relative;
      display:flex;flex-direction:column;align-items:center;gap:8px;
      padding:10px 16px;
      border:0;border-radius:14px;cursor:pointer;
      background:transparent;
      transition:.3s cubic-bezier(.2,.8,.2,1);
    }
    .mat-card:hover{background:rgba(184,147,90,.08)}
    .mat-card img{
      width:52px;height:52px;border-radius:12px;
      object-fit:cover;background:#f0ece4;display:block;
      border:2px solid transparent;
      transition:.3s;
    }
    .mat-card.active img{
      border-color:var(--gold);
      box-shadow:0 0 0 4px rgba(184,147,90,.12);
    }
    .mat-card .label{
      font-size:11px;color:var(--ink-2);letter-spacing:.15em;
      transition:.3s;
    }
    .mat-card.active .label{color:var(--ink);font-weight:600}

    /* 右下角提示 */
    #hint{
      position:fixed;right:36px;bottom:40px;
      font-size:11px;color:var(--ink-2);letter-spacing:.15em;
      opacity:.6;z-index:10;pointer-events:none;
    }

    @media (max-width:640px){
      #modelUI{left:16px;gap:10px}
      .model-card{padding:8px;border-radius:14px;width:76px}
      .model-card img{width:44px;height:44px}
      .model-card .name{font-size:12px}

      #matUI{bottom:20px;gap:8px;padding:8px;border-radius:16px}
      .mat-card{padding:8px 12px}
      .mat-card img{width:44px;height:44px}
      .mat-card .label{font-size:10px}

      #hint{right:20px;bottom:auto;top:20px;font-size:10px}
    }
  </style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<div id="modelUI">
  <button class="model-card active" data-model="0">
    <img src="./teapot1.png" alt="">
    <div class="meta">
      <div class="name">茶壶 · 一</div>
    </div>
  </button>
  <button class="model-card" data-model="1">
    <img src="./teapot2.png" alt="">
    <div class="meta">
      <div class="name">茶壶 · 二</div>
    </div>
  </button>
</div>

<div id="matUI">
  <button class="mat-card active" data-mat="0">
    <img src="./matA.png" alt="">
    <span class="label">材质 A</span>
  </button>
  <button class="mat-card" data-mat="1">
    <img src="./matB.png" alt="">
    <span class="label">材质 B</span>
  </button>
</div>

<div id="hint">拖动旋转 · 滚轮缩放</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

/* ==================== 场景 ==================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f2ec);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.8, 4);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 1.5;
controls.maxDistance = 10;

/* ==================== 灯光 ==================== */
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const key = new THREE.DirectionalLight(0xffffff, 3);
key.position.set(4, 6, 5);
scene.add(key);

const fill = new THREE.DirectionalLight(0xffffff, 1.2);
fill.position.set(-4, 3, 4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.5);
rim.position.set(0, 4, -6);
scene.add(rim);

/* ==================== 贴图 ==================== */
const texLoader = new THREE.TextureLoader();
function loadTex(url){
  const t = texLoader.load(url);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ==================== 材质 ==================== */
const M = {
  teapot1: [
    new THREE.MeshStandardMaterial({ map: loadTex('./teapot1_A.jpg'), roughness: 0.5 }),
    new THREE.MeshStandardMaterial({ map: loadTex('./teapot1_B.jpg'), roughness: 0.5 }),
  ],
  teapot2: [
    new THREE.MeshStandardMaterial({ map: loadTex('./teapot2_A.jpg'), roughness: 0.5 }),
    new THREE.MeshStandardMaterial({ map: loadTex('./teapot2_B.jpg'), roughness: 0.5 }),
  ],
};

/* ==================== 状态 ==================== */
const teapots = [null, null];
let currentModel = 0;
let currentMat = 0;

function applyMaterialTo(target, mat){
  if(!target) return;
  target.traverse(o => { if(o.isMesh) o.material = mat; });
}

function refresh(){
  teapots.forEach((t,i) => { if(t) t.visible = (i === currentModel); });

  const mat = M['teapot' + (currentModel + 1)][currentMat];
  applyMaterialTo(teapots[currentModel], mat);

  document.querySelectorAll('.model-card').forEach((b,i) => {
    b.classList.toggle('active', i === currentModel);
  });
  document.querySelectorAll('.mat-card').forEach((b,i) => {
    b.classList.toggle('active', i === currentMat);
  });
}

function loadTeapot(url, index, scaleFactor = 1){
  new OBJLoader().load(url, (obj) => {

    obj.rotation.x = -Math.PI / 2;

    const box0 = new THREE.Box3().setFromObject(obj);
    const size0 = box0.getSize(new THREE.Vector3());
    const maxDim = Math.max(size0.x, size0.y, size0.z);
    obj.scale.setScalar((2 / maxDim) * scaleFactor);

    const box1 = new THREE.Box3().setFromObject(obj);
    const c = box1.getCenter(new THREE.Vector3());
    obj.position.x -= c.x;
    obj.position.z -= c.z;
    obj.position.y -= box1.min.y;

    scene.add(obj);
    teapots[index] = obj;
    refresh();
  }, undefined, err => console.error(url, '加载失败', err));
}

loadTeapot('./teapot1.obj', 0);
loadTeapot('./teapot2.obj', 1, 0.66);

/* ==================== 按钮 ==================== */
document.querySelectorAll('.model-card').forEach(btn => {
  btn.addEventListener('click', () => {
    currentModel = Number(btn.dataset.model);
    refresh();
  });
});
document.querySelectorAll('.mat-card').forEach(btn => {
  btn.addEventListener('click', () => {
    currentMat = Number(btn.dataset.mat);
    refresh();
  });
});

/* ==================== 渲染循环 ==================== */
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
